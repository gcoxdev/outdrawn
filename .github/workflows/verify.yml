name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Locate Chromium
        run: node --input-type=module -e 'import { chromium } from "playwright"; console.log("CHROMIUM=" + chromium.executablePath())' >> "$GITHUB_ENV"
      - run: npm run verify
